<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aishwaryam Gold</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{background:#f5f5f5;}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

/* HEADER */
.header{
  background:#a00000;
  color:#fff;
}

.header .container{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
}

.logo img{height:40px;}

/* SLIDER */
.slider{position:relative;overflow:hidden;}
.slides{display:flex;transition:0.5s;}
.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
  position:relative;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  text-align:center;
}

.overlay h1{font-size:32px;}

.btn{
  margin-top:15px;
  background:#ff6a2f;
  padding:12px 25px;
  border-radius:25px;
  color:white;
  text-decoration:none;
}

/* NAV */
.nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.5);
  color:#fff;
  border:none;
  padding:12px;
  border-radius:50%;
  cursor:pointer;
}
.prev{left:15px;}
.next{right:15px;}

/* SERVICES */
.services{padding:50px 0;}
.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.service{
  background:linear-gradient(135deg,#f2c94c,#d4a017);
  padding:25px;
  border-radius:12px;
  text-align:center;
  font-weight:600;
}

/* CTA */
.cta{
  background:linear-gradient(to right,#d4af37,#b8962e);
  color:white;
  text-align:center;
  padding:50px 0;
}

/* CONTACT */
.contact{
  padding:50px 0;
}

.contact .container{
  background:#fff;
  padding:40px;
  border-radius:12px;
  max-width:500px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
}

.contact input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #ccc;
  border-radius:8px;
}

.contact button{
  width:100%;
  padding:12px;
  border:none;
  background:#a00000;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* FOOTER */
.footer{
  background:#690202;
  color:white;
  padding:40px 0;
  text-align:center;
}

/* MOBILE */
@media(max-width:768px){
  .service-grid{grid-template-columns:1fr;}
  .slide{height:350px;}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="container">
    <div class="logo">
      <img src="logo.png">
    </div>
    <div>Instant Cash for Gold</div>
  </div>
</div>

<!-- SLIDER -->
<div class="slider">
  <div class="slides" id="slides">

    <div class="slide" style="background-image:url('b3.jpg');">
      <div class="overlay">
        <h1>Get Instant Cash for Gold</h1>
        <a href="tel:04314054265" class="btn">Call Now</a>
      </div>
    </div>

    <div class="slide" style="background-image:url('b4.avif');">
      <div class="overlay">
        <h1>Trusted Gold Buyers</h1>
        <a href="tel:04314054265" class="btn">Call Now</a>
      </div>
    </div>

  </div>

  <button class="nav prev" onclick="moveSlide(-1)">❮</button>
  <button class="nav next" onclick="moveSlide(1)">❯</button>
</div>

<!-- CTA -->
<div class="cta">
  <h2>📞 0431 405 4265</h2>
  <p>Call Now for Instant Cash</p>
</div>

<!-- CONTACT -->
<div class="contact">
  <div class="container">
    <h2>Contact Us</h2>

<form action="https://formsubmit.co/sm4115337@gmail.com" method="POST">

  <!-- REQUIRED SETTINGS -->
  <input type="hidden" name="_next" value="https://sangeethajd2026.github.io/IshwaryamGoldBuyers/thankyou1.html">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_subject" value="New Gold Buyer Lead">

  <input name="name" placeholder="Your Name" required>
  <input type="email" name="email" placeholder="Your Email" required>
  <input name="phone" placeholder="Phone Number" required>
  <input name="subject" placeholder="Subject" required>

  <button type="submit">Submit</button>
</form>

  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <p>© 2026 Aishwaryam Gold</p>
</div>

<script>
let index = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;

function moveSlide(step){
  index = (index + step + total) % total;
  slides.style.transform = "translateX(-" + (index * 100) + "%)";
}

setInterval(()=>{ moveSlide(1); },4000);
</script>

</body>
</html>
